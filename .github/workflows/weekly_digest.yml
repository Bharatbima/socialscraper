name: Weekly Insurance Digest

on:
  schedule:
    - cron: '30 0 * * 1'   # Monday 6:00 AM IST (00:30 UTC)
  workflow_dispatch:

permissions:
  contents: write
  id-token: write           # Required for Workload Identity Federation

jobs:
  run-digest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python main.py

      - name: Commit digest
        run: |
          git config user.name "Bharat Bima Digest Bot"
          git config user.email "bot@bharatbima.co"
          git add digests/
          git diff --staged --quiet || git commit -m "Weekly digest $(date +'%Y-%m-%d')"
          git push
