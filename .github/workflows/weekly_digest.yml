name: Weekly Insurance Digest

on:
  schedule:
    - cron: '30 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-digest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py

      - name: Set digest date
        run: echo "DIGEST_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Email digest
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: hr.srinivas@bharatbima.co
          subject: "Bharat Bima Weekly Digest - ${{ env.DIGEST_DATE }}"
          body: file://digests/latest.md

      - name: Commit digest
        run: |
          git config user.name "Bharat Bima Digest Bot"
          git config user.email "bot@bharatbima.co"
          git add digests/
          git diff --staged --quiet || git commit -m "Weekly digest $(date +'%Y-%m-%d')"
          git push
